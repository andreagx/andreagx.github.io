name: Hugo Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scarica PaperMod
        uses: actions/checkout@v5
        with:
          repository: adityatelange/hugo-PaperMod
          ref: v8.0
          path: themes/PaperMod
          persist-credentials: false
      - name: Correggi i riferimenti ai partial di PaperMod v8.0
        run: sed -i -e 's@"partials/templates/_funcs/get-page-images"@"templates/_funcs/get-page-images"@g' -e 's@\.Site\.Social@.Site.Params.social@gI' themes/PaperMod/layouts/partials/templates/*.html
      - name: Installa Hugo
        env:
          HUGO_VERSION: 0.147.9
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o "$RUNNER_TEMP/hugo.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo
      - name: Genera il sito
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          export HUGO_PARAMS_CLOUDFLARETOKEN="$CLOUDFLARE_WEB_ANALYTICS_TOKEN"
          "$RUNNER_TEMP/hugo" --environment production --minify --panicOnWarning
      - name: Verifica le pagine generate
        run: |
          grep -q 'andreagx.blogspot.com' public/index.html
          grep -q 'searchInput' public/search/index.html
          grep -q 'https://andreagx.github.io/' public/sitemap.xml
          python3 -c 'import json; assert any("Chi sono" == page["title"] for page in json.load(open("public/index.json")))'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
